<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Life Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body class="auth-page">
<div class="auth-wrap">
  <div class="auth-brand"><span class="brand-mark"></span>LIFEHUB</div>
  <div class="card auth-card">
    <h1 style="font-size:1.2rem;">Set a New Password</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{% for m in messages %}<div class="flash-msg">{{ m }}</div>{% endfor %}</div>
      {% endif %}
    {% endwith %}
    <form method="post" class="inline-form" style="flex-direction:column; align-items:stretch;">
      <label>New password <input type="password" name="password" minlength="8" required autofocus></label>
      <label>Confirm new password <input type="password" name="confirm" minlength="8" required></label>
      <button type="submit">Update Password</button>
    </form>
  </div>
</div>
</body>
</html>
